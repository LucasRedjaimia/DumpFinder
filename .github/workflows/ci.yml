name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Plain build (build.ps1 kills running processes and copies the exe to the repo root).
      - name: Build Dump Finder
        shell: pwsh
        run: dotnet build src/DumpFinder.csproj -c Release -nologo -v:minimal -warnaserror -o out

      - name: Check translations (14 languages)
        shell: pwsh
        run: dotnet run --project tools/I18nTool -c Release -- --check src src/Locales

      # DumpFinder.exe is a GUI (WinExe): PowerShell does not wait for it, so each self-test runs through
      # Start-Process -Wait and its exit code (= number of failed checks) decides the result.
      - name: Self-tests
        shell: pwsh
        run: |
          $exe = Resolve-Path out/DumpFinder.exe
          New-Item -ItemType Directory -Force reports | Out-Null
          $tests = @(
            @{ Name = 'parse';    Args = @('--parse-selftest',    'reports/parse.txt') },
            @{ Name = 'detect';   Args = @('--detect-selftest',   'reports/detect.txt') },
            @{ Name = 'update';   Args = @('--update-selftest',   'reports/update.txt') },
            @{ Name = 'optimize'; Args = @('--optimize-selftest', 'reports/optimize.txt') },
            # No GPU / OpenCL on the runner: the GPU stages would be reported as skipped, not passed.
            @{ Name = 'stress';   Args = @('--stress-selftest',   'reports/stress.txt', 'cpu,ram,disk') }
          )
          $failed = @()
          foreach ($t in $tests) {
            $argList = $t.Args | ForEach-Object { if ($_ -like 'reports/*') { (Join-Path $PWD $_) } else { $_ } }
            $p = Start-Process -FilePath $exe -ArgumentList $argList -Wait -PassThru -NoNewWindow
            $report = Join-Path $PWD ($t.Args[1])
            Write-Host "::group::$($t.Name) (exit $($p.ExitCode))"
            if (Test-Path $report) { Get-Content $report -Encoding utf8 } else { Write-Host 'no report written' }
            Write-Host '::endgroup::'
            if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { $failed += $t.Name }
          }
          if ($failed.Count -gt 0) { throw "Failed self-tests: $($failed -join ', ')" }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-reports
          path: reports/
          if-no-files-found: ignore

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DumpFinder
          path: out/DumpFinder.exe
