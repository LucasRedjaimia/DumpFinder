    <linearGradient id="br" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B0A3FF"/><stop offset="1" stop-color="#7461FA"/></linearGradient>
    <linearGradient id="ft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF5E62"/><stop offset="1" stop-color="#FFA24A"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="80" y="76" width="352" height="96" rx="32" fill="url(#br)"/>
  <rect x="80" y="208" width="176" height="96" rx="32" fill="url(#br)"/>
  <rect x="288" y="196" width="160" height="96" rx="32" fill="url(#ft)"/>
